# Nuraghe build ABM - single configuration file.
# All input paths are relative to data_dir. Change data_dir (one line) to move the inputs.
# cache_dir / output_dir are relative to the folder holding this config file (or absolute).

data_dir: /ABSOLUTE/PATH/TO/data   # PLACEHOLDER: folder holding the inputs (layout: data/README.md)
paths:
  sites: nuraghe-build-abm/data/nurnet_nuraghi.shp
  cost_raster: costsurface/sardinia_drag_cost_8dir_mu03_25832_int.tif
  lithology: geology/sardinia_lithology_25832.shp
  cache_dir: cache
  output_dir: output

crs: EPSG:25832

# --- Quarry stone (the authors' list). The code of each type = position in this list (1-based).
lithology_field: STONE
# Stone rule (specified by the authors): HYBRID baseline = the recorded building stone where it is known
# (Nurnet's data (site building stone), field `materiale`), otherwise the nearest of the 7 permitted classes.
stone_rule: hybrid            # hybrid | stones7 (7 classes, no recorded stone) | stones4 (the authors' original 4)
allowed_stones: [limestone/marble, metamorphic, basalt, granite, acid volcanic, trachyte, andesite]
stones4: [limestone/marble, metamorphic, basalt, granite]
materiale:
  file: nuraghe-build-abm/materiale/nid_materiale_prod.csv   # relative to data_dir; columns codice (= UID), sa_materiale
  citation: "Nurnet's data (site building stone)"
  # token -> ARPAS STONE classes. A value is split on ' e ' and ','; a mix = the union of its mapped tokens;
  # tokens not listed (Arenaria, Marna, Non determinato, Selce, Dolomia, dacite, Granodiorite, truncated 'Sc', empty)
  # contribute nothing; a value with no mapped token falls back to the 7-stone rule.
  map:
    Basalto: [basalt]
    Granito: [granite]
    Porfido: [granite, other intrusive]
    Calcare: [limestone/marble]
    Marmo: [limestone/marble]
    Trachite: [acid volcanic, trachyte, tuff]
    Riolite (Liparite): [acid volcanic, trachyte, tuff]
    Tufo (Ignimbrite): [acid volcanic, trachyte, tuff]
    Ignimbrite: [acid volcanic, trachyte, tuff]
    Andesite: [andesite]
    Scisto: [schist, metamorphic]     # schist allowed for these sites only (general list excludes it, pending the authors)
rasterize_all_touched: false   # false = an outcrop claims a cell only if it covers the cell centre

# --- Site fields
site_fields: {uid: UID, name: NAME, comune: COMUNE, towers: TWR_N, tower_filled: TWR_FILL}
nodata_snap_radius_cells: 20   # if a site falls on nodata / unreachable cell, search this far for the nearest valid cell
# Sites from which no allowed outcrop can be reached over land (6 on Isola di San Pietro, which has only
# acid volcanic rock): 'local_min_haul' = keep them, assume a local quarry at min_haul_flatm, flag them;
# 'exclude' = leave them out of the model.
unreachable_policy: local_min_haul

# --- Model parameters
hours_per_day: 8
builders:
  base: 50              # builders for a 1-tower nuraghe
  per_extra_tower: 25   # + per additional tower (7 towers -> 200)
  rand_min: 0.9         # uniform multiplicative factor
  rand_max: 1.1
  min: 50
  max: 200
stone:
  tonnes_per_tower: 1350        # Webster 1991: ~3,000 blocks x ~450 kg
  block_median_kg: 450          # ~0.19 m3 x 2,386 kg/m3
  block_sigma: 0.6              # lognormal sigma (log space)
  block_min_kg: 60
  block_max_kg: 2400
transport:
  pull_kg_per_person: 100       # UCL 2016 Stonehenge sledge: ~10 people per ~1 t
  drag_speed_ms: 0.6            # same experiment
  return_walk_ms: 1.4
  load_unload_h: 0.25
  min_haul_flatm: 100           # quarry face -> site when the site sits on the outcrop
other_mandays_per_tower: 2500   # Webster Table 1: ~3,600 man-days/tower minus ~1,100 transport
max_days: 20000                 # safety stop for the scheduler (never reached in practice)

# --- Replicates: run i uses seed i
seeds: {first: 1, last: 100}

# --- Verification
verify:
  spot_check_n: 3
  spot_check_pad_m: 15000
  webster_target_haul_m: 200
  dem: dem/sardinia_dem_GLO30_25832.tif   # only used by tests/verify_hauls.py (relative to data_dir)
  dem_mu: 0.3

# --- Cooperation scenarios (python model.py config.yaml --scenario NAME | all)
# Cooperation is a Builder attribute, drawn per builder per run from the site's RNG stream (after the
# block draw). Cooperators pool freely into crews of any size. Non-cooperators work only as one fixed
# crew per household (their non-cooperating members), dragging blocks <= size x pull_kg_per_person.
# The baseline (no --scenario) is p_coop = 1, no help - identical to `full`.
scenarios:
  household_size: 5         # builders packed consecutively into households; the last may be smaller
  split_cost_mh: 1.0        # man-hours added to the quarry/build pool per split (cut) of a heavy block
  help_radius_m: 10000      # inter-site help: straight-line radius to look for an unfinished site
  help_walk_ms: 1.4         # helpers walk there at this speed; the walk is charged to the helped site
  coupled_max_ranks: 2      # memory guard: in the help scenario each rank holds the whole island (~1.7-1.9 GB)
  list:
    none:      {p_coop: 0.0}
    low:       {p_coop: 0.25}
    mixed:     {p_coop: 0.5}
    mostly:    {p_coop: 0.75}
    full:      {p_coop: 1.0}
    high:      {p_coop: 1.0, inter_site_help: true}
    patchwork: {site_coop_prob: 0.5}   # per site: p_coop = 1 with this probability, else 0
    # S9 sea access (section `sea:` below; tools/sea_routes.py builds cache/sea/*)
    S9_sea_4kn: {p_coop: 1.0, sea_kn: 4}
    S9_sea_5kn: {p_coop: 1.0, sea_kn: 5}
    S9_sea_6kn: {p_coop: 1.0, sea_kn: 6}
    S9_sea_2kn: {p_coop: 1.0, sea_kn: 2}
    TEST_full_workparty: {p_coop: 1.0, builders_rule: {residents_by_towers: [[5, 40], [40, 110], [110, 185], [185, 260], [260, 330], [330, 400], [330, 400]], adult_share: 0.5}}
    TEST_high_workparty: {p_coop: 1.0, inter_site_help: true, builders_rule: {residents_by_towers: [[5, 40], [40, 110], [110, 185], [185, 260], [260, 330], [330, 400], [330, 400]], adult_share: 0.5}}   # laden craft (H&F 2006 p.18 'corrected speed of 2 knots'); tables in cache/sea
    high_sea:   {p_coop: 1.0, inter_site_help: true, sea_kn: 5}

# --- Literature-based chaîne opératoire scenarios: see lit_scenarios below (filled in step by step)
lit_scenarios:
  # Sources: literature/general_energetics_logistics.md (GEN, line numbers) and literature/nuraghe_specific.md (NUR).
  # FREE = no empirical value in either review; a stated assumption, flagged in METHODS.md section 8.
  dem: dem/sardinia_dem_GLO30_25832.tif      # relative to data_dir; used to rebuild cost rasters per mu
  complex_far_min_towers: 3     # S5c: TWR_N >= 3 (plan's mapping; FREE)
  complex_far_min_dist_m: 3000  # S5c: S'Urachi, basalt "almost 3 km" (NUR 49, 198)
  # --- stage-explicit Webster baseline
  webster_md_per_tower: {quarry: 500, transport: 1100, dress: 1300, build: 700}   # NUR 181 (Table 1, single tower)
  webster_density_kg_m3: 2386   # NUR 155
  lift_share_of_build: 0.5      # FREE (plan): half of Webster's building stage is lifting
  baseline_mu: 0.3
  # --- S1 procurement, person-hours per m3 of stone
  quarry_ph_m3: {scree: 2.0, joints_low: 11.0, joints_high: 17.5}   # GEN 48, 45, 200 (Boswinkel 2021 Table 7.2)
  # --- S2 dressing
  facade: {facade_ph_m3_mid: 131.5, cyclopean_ph_m3_mid: 40.85}     # GEN 57, 199: Table 8.3, 96-167 and 6.7-75 (midpoints)
  facing_thickness_m: 0.5       # FREE (plan)
  fine_min_towers: 2            # plan: complex nuraghi only; late-phase isodomic masonry (NUR 61)
  # --- S4 lifting; tower geometry is FREE (plan): 15 m, truncated cone 12 m -> 8 m, 0.9 m courses
  geometry: {tower_height_m: 15.0, course_height_m: 0.9, base_diam_m: 12.0, top_diam_m: 8.0}
  lever_ph_per_block_course: 0.37   # GEN 77, 204 (Hodges 1989 / de Haan 2009 via Boswinkel 2021: 116, 124)
  stair_lever_last_m: 1.0       # FREE (plan, Laner's internal stair): only the last metre per course is levered
  ramp:
    slope: 0.2                  # GEN 78, 205
    width_m: 3.0                # FREE (plan)
    dig_ph_m3: 4.2              # GEN 78 (Turner 2018)
    compact_kg_per_ph: 1000     # GEN 78 (Lacquement 2009)
    carry_load_kg: 50           # GEN 68, 205 (DeLaine via Boswinkel 2021: 122)
    carry_h_per_m: 0.000444     # GEN 68, 205
    carry_dist_m: 50            # FREE: mean carrying distance of ramp earth
    earth_density_kg_m3: 1600   # FREE: standard value for earth (not in the reviews)
    build_remove_factor: 2      # plan: build + remove
    check_boswinkel: {height_m: 3.0, range_ph: [971, 1208], vol_6m_m3: 354, vol_9m_m3: 796}  # GEN 78, 205
  # --- S3 transport
  f_person_kgf: 30              # GEN 202: 300 N per person (Cotterell & Kamminga via Boswinkel 2021: 111); 30/0.3 = 100 kg
  oxen:
    pull_N_per_ox: 520          # GEN 69, 203: 491-549 N (midpoint)
    yoke_efficiency: [0.95, 0.80, 0.63]   # GEN 203: 1, 2, 3 pairs (Barwell & Ayre 1982); >3 pairs keep 0.63 (FREE)
    speed_ms: 0.75              # GEN 69, 203: 0.7-0.8 m/s
    return_speed_ms: 0.75       # FREE: team walks back at ox pace
    men_per_team: 2             # plan: 1 drover + 1 helper per team (DeLaine: 1 driver per yoke, GEN 69)
    mu: 0.3                     # cost surface and friction kept at the baseline
  # --- S6 density and hardness (FREE: standard values; GEN 212 gives basalt ~2.9-3.0, limestone ~2.5)
  density_kg_m3: {basalt: 2950, granite: 2650, limestone/marble: 2600, metamorphic: 2750}
  hardness: {basalt: 2.0, granite: 2.0, limestone/marble: 1.0, metamorphic: 1.0}   # FREE (Turner 2020: 71 critique, GEN 136)
  # --- S7 Webster's class totals (NUR 157-158, 181-183); TWR_N -> class mapping is FREE (plan)
  webster_classes:
    - {name: single,    min_towers: 1, max_towers: 1, tonnes: 1350, blocks: 3000,  quarry_md: 500,  dress_md: 1300, build_md: 700}
    - {name: multi,     min_towers: 2, max_towers: 3, tonnes: 3100, blocks: 7000,  quarry_md: 1200, dress_md: 3000, build_md: 1600}
    - {name: bastioned, min_towers: 4, max_towers: 99, tonnes: 6700, blocks: 15000, quarry_md: 2500, dress_md: 6400, build_md: 3500}
  learning_rate: 0.15           # FREE (GEN 91: no archaeological learning rate; sensitivity only)
  # --- duration and threshold
  duration:
    workforces: {household: 6, trump: 15, canton: 500}   # NUR 205 (5-6), NUR 130/206 (10-20), GEN 26 (500 = regional draw)
    calendars_days: {webster40: 40, webster90: 90, long255: 255}   # NUR 185; GEN 36, 206 (220-290, midpoint 255)
  community_threshold_ph: 30000 # GEN 26, 207 (Wunderlich et al. 2024)
  defaults: {quarry: webster, dress: webster, lift: webster, mu: 0.3, haul: base}
  list:
    webster:            {}
    S1a_scree:          {quarry: scree}
    S1b_joints_low:     {quarry: joints_low}
    S1b_joints_high:    {quarry: joints_high}
    S2a_unworked:       {dress: none}
    S2b_fine:           {dress: fine}
    S3a_rails_tallow:   {mu: 0.1,  haul: mu0.1}
    S3b_rails_grease:   {mu: 0.05, haul: mu0.05}
    S3c_dry_ground:     {mu: 0.38, haul: mu0.38}
    S3d_rough:          {mu: 0.5,  haul: mu0.5}
    S3e_oxen:           {oxen: true}
    S4a_lever:          {lift: lever}
    S4b_ramp:           {lift: ramp}
    S4c_internal_stair: {lift: stair}
    S5a_onsite:         {onsite: true}
    S5b_any_buildstone: {haul: buildstone}
    S5c_complex_far:    {haul: complexfar}
    S6_density:         {density: true}
    S7_webster_classes: {classes: true}
    S8_learning:        {learning: true}
    LOW:                {quarry: scree, dress: none, mu: 0.1, haul: buildstone_mu0.1, lift: stair}
    HIGH:               {quarry: joints_high, dress: fine, mu: 0.5, haul: mu0.5, lift: ramp, density: true}
    # REALISTIC: per-site mixed rules within the literature family (lit.mixed_haul / lit.resolve_site), hybrid
    # stone base, S6 density + S8 learning on, no ramp, no S5c, no oxen. Each rule and its source: REALISTIC_NOTES.md.
    REALISTIC:
      density: true                          # S6 (GEN 136, 212)
      learning: true                         # S8 (FREE rate; NUR 107, 132: complexes as one planned project)
      mixed:
        quarry_on_outcrop: joints_low        # S1b: site on its outcrop, bedrock broken along joints (NUR 27-29)
        quarry_off_outcrop: scree            # S1a: collected boulders from slopes nearby (NUR 20, 35)
        dress_none_max_towers: 1             # S2a: simple towers cyclopean, undressed (NUR 39, 58; GEN 57)
        dress_fine_min_towers: 3             # S2b: polylobate complexes (Santu Antine, Su Nuraxi, S'Urachi; NUR 60-61)
        long_min_haul_m: 1000                # rails only where the sledge route > 1 km (FREE; NUR 45-46, 195-196)
        short: {mu: 0.38, haul: mu0.38}      # S3c sledge on dry ground (GEN 64, 201)
        long: {mu: 0.1, haul: mu0.1}         # S3a tallowed timber rails (GEN 65, 89, 214)
        type_field: TYPE                     # sites shapefile attribute
        lift_by_type: {"Nuraghe a corridoio (protonuraghe)": lever}   # S4a: no tholos stair (NUR 81)
        lift_default: stair                  # S4c: Laner's intramural stair as the builders' ramp (NUR 79-80)
    REALISTIC_oxen:                          # optional variant: ox teams instead of rails on the long routes
      density: true
      learning: true
      mixed:
        quarry_on_outcrop: joints_low
        quarry_off_outcrop: scree
        dress_none_max_towers: 1
        dress_fine_min_towers: 3
        long_min_haul_m: 1000
        short: {mu: 0.38, haul: mu0.38}
        long: {oxen: true, mu: 0.3, haul: base}   # S3e (GEN 69, 203); cattle LBA only (NUR 54)
        type_field: TYPE
        lift_by_type: {"Nuraghe a corridoio (protonuraghe)": lever}
        lift_default: stair

# --- Adaptive alliance scenarios (python model.py ... --alliance NAME|all; alliance.py). FREE = assumption.
alliance:
  k_quarries: 5               # spec: the 5 cheapest distinct quarry faces (outcrop regions) per site
  kbest_max_settle: 3000000   # search cap per site (cells settled)
  # time
  season_days: 90             # NUR 185: 90 communal days a year (Renfrew 1973 via Webster 1991); one season = one year
  start_rate: 0.0022222222    # FREE: fraction of all sites starting each season (1/450): ~450 seasons, cf. ~500 years
                              #       of nuraghe building (Ialongo 2018, NUR 116). Start order random per seed.
  max_seasons: 3000           # safety stop
  # requests, relays, trust (all FREE)
  R_m: 10000                  # FREE: neighbourhood radius (straight line) for requests, relays, imitation, track allies
  relay_fractions: [0.25, 0.5, 0.75]   # spec: hand-off at this fraction of the route's drag cost
  relay_min_flatm: 300        # FREE: no relay on routes cheaper than this (on-outcrop sites haul 100 m)
  max_asks: 3                 # FREE: candidates asked per task before doing it oneself
  trust0: 0.5                 # FREE
  delta_up: 0.1               # FREE: trust gain when the asked community helps
  delta_down: 0.2             # FREE: trust loss when it refuses after having received help from the asker
  alliance_threshold: 0.7     # FREE: alliance = mutual trust >= this
  beta0: 0.0                  # FREE: acceptance logit = beta0 + beta1 trust - beta2 backlog_days - beta3 distance_km
  beta1: 2.0
  beta2: 0.05
  beta3: 0.2
  # learning (all FREE)
  epsilon: 0.1                # exploration probability per action dimension
  alpha: 0.5                  # Q learning rate
  p_imit: 0.3                 # probability per tower of copying a cheaper neighbour's strategy
  # cooperation mechanisms
  track_mu: 0.1               # GEN 65 (tallowed timber rails, Richards & Whitby 1997: 237-239)
  setup_mh: 200               # FREE: man-hours to open a fresh quarry face
  max_ranks: 8                # seed-parallel ranks (whole island per rank, ~0.4 GB each)
  defaults: {requests: false, trust: false, specialisation: false, tracks: false, shared_quarry: false,
             b: 0.85, track_cost_mh_per_m: 2.0, defector_frac: 0.0, imitation: true}
  list:
    A0_alone:          {}
    A1_ask:            {requests: true, accept_fixed: 0.5}
    A2_trust:          {requests: true, trust: true}
    A3_trust_learning: {requests: true, trust: true, specialisation: true}
    A4_trust_track:    {requests: true, trust: true, tracks: true}
    A5_full:           {requests: true, trust: true, specialisation: true, tracks: true, shared_quarry: true}
    A5_full_freerider: {requests: true, trust: true, specialisation: true, tracks: true, shared_quarry: true, defector_frac: 0.2}
  verify_scenarios:
    A0_verify:         {b: 1.0, setup_mh: 0, imitation: false, fixed_actions: {quarry_face: 0}}
  sensitivity:        # on A5_full, 10 seeds each (full factorial)
    base: A5_full
    seeds: [1, 10]
    R_m: [5000, 10000, 20000]
    b: [0.85, 0.95, 1.0]          # Wright 1936 progress ratio per doubling (GEN 91); 1.0 = no learning
    track_cost_mh_per_m: [0.5, 2.0, 5.0]

# --- Pre-existing networks (pre_networks.py; python model.py config.yaml --pre NAME|all|sensitivity). FREE = assumption.
# Self-contained: every scenario is the alliance A2 rule set with requests restricted to these ties.
pre_networks:
  p_tie: 0.9                 # FREE: probability a tied community accepts a request (no trust needed)
  broker_people: 1           # FREE: people per broker who walk the request on (reach > 1), there and back
  generator_seed: 2026       # FREE: seed of the group / shape generator (ties identical in every run of a scenario)
  smallworld_p: 0.1          # FREE: Watts-Strogatz rewiring probability (to a community outside the group)
  smallworld_radius_m: 10000 # FREE: rewired ties go to a community within this radius
  density_cell_m: 30000      # plan: 30 km cells for the "dense" region variant
  sizes:
    G3_canton:  {seed_rule: multi_tower, target_size: 2.65}  # Ugas via Moravetti et al. 2009 p. ~361 (copyrighted): ~2,700 canton seats
    G5:         {size: 5}                                    # FREE lower bound
    G9_verify:  {size: 9}                                    # sensitivity only: ~800-canton reading, UNVERIFIED in Ugas 2005
    G20_system: {size: 20}                                   # Perra 2008 (>= 350 territorial systems), second-hand
    G50:        {size: 50}                                   # FREE
    G133_tribe: {size: 133, two_level: G3_canton}            # 7,167 / 54 tribes; ~50 canton chiefs per tribe (Ugas via Moravetti et al. 2009)
  main_grid:                 # size x shape at reach 1, 100 seeds
    sizes: [G3_canton, G5, G20_system, G50, G133_tribe]
    shapes: [chain, kmesh2, kmesh4, kmesh8, hub, smallworld, complete]
  extra:
    P_partners2:  {all: {partners: 2}}
    P_partners5:  {all: {partners: 5}}
    P_partners10: {all: {partners: 10}}
    P_G20_system_kmesh4_h2: {all: {groups: G20_system, shape: kmesh4}, reach: 2}
    P_G20_system_kmesh4_h3: {all: {groups: G20_system, shape: kmesh4}, reach: 3}
    P_G133_tribe_hub_h2:    {all: {groups: G133_tribe, shape: hub}, reach: 2}
    P_G133_tribe_hub_h3:    {all: {groups: G133_tribe, shape: hub}, reach: 3}
    P_G9_verify_kmesh4:     {all: {groups: G9_verify, shape: kmesh4}}
    P_G20_kmesh4_on_outcrop:  {all: {groups: G20_system, shape: kmesh4, seed_from: on_outcrop}}
    P_G20_kmesh4_off_outcrop: {all: {groups: G20_system, shape: kmesh4, seed_from: off_outcrop}}
    P_G20_kmesh4_north:   {all: {groups: G20_system, shape: kmesh4, region: north}}
    P_G20_kmesh4_central: {all: {groups: G20_system, shape: kmesh4, region: central}}
    P_G20_kmesh4_south:   {all: {groups: G20_system, shape: kmesh4, region: south}}
    P_G20_kmesh4_dense:   {all: {groups: G20_system, shape: kmesh4, region: dense}}
    P_wide_stone_local_build: {stone: {groups: G133_tribe, shape: kmesh4}, move: {groups: G20_system, shape: chain},
                               build: {groups: G3_canton, shape: hub}}
    P_local_stone_wide_build: {stone: {groups: G3_canton, shape: hub}, move: {groups: G20_system, shape: chain},
                               build: {groups: G133_tribe, shape: kmesh4}}
    P_D7_G20_kmesh4_trust:    {all: {groups: G20_system, shape: kmesh4}, trust: true}
    P_D8_G20_kmesh4_tieloss:  {all: {groups: G20_system, shape: kmesh4}, tie_loss_refusals: 2}   # FREE r = 2
    P_G20_kmesh4_learning:    {all: {groups: G20_system, shape: kmesh4}, specialisation: true}
    P_G20_kmesh4_track:       {all: {groups: G20_system, shape: kmesh4}, tracks: true}
  sensitivity:               # 10 seeds per cell
    seeds: [1, 10]
    sizes: [G3_canton, G5, G9_verify, G20_system, G50, G133_tribe]
    shapes: [chain, kmesh2, kmesh4, kmesh8, hub, smallworld, complete]
    reach: [1, 2, 3]
    learning: [false, true]

# --- S9 sea access (specified by the authors; DEV_SEA S9_NOTES.md). Paths relative to data_dir.
# Alliance / pre-network sea versions: append '_sea' (default_kn) or '_sea<kn>kn' to any scenario name,
# e.g. --alliance A1_ask_sea,A5_full_sea  --pre P_G50_hub_sea.  Sea off (no sea_kn) = the original code path.
sea:
  dem: dem/sardinia_dem_GLO30_25832.tif        # nodata -9999; land = z > 0
  slope: costsurface/sardinia_slope_deg_25832.tif   # same grid; used for the beach rule
  speeds_kn: [4, 5, 6]          # specified by the authors; H&F 2006 p.18-19: 5 kn benchmark, ~4 kn average voyage
  default_kn: 5
  extra_speeds_kn: [2]          # haul-table sensitivity only: H&F 2006 p.18 laden raft 'corrected speed of 2 knots'
  sea_grid_factor: 3            # boat routing on 90 m blocks (3 x 3 cells), block = water if >= 50% sea cells
  sea_band_m: 2000              # coastal water band: water within 2 km of land (no open-sea crossing). ASSUMPTION
  coast_band_m: 2000            # sites and quarries within 2 km of the coast may use the sea (specified by the authors)
  land_band_m: 5000             # land legs are routed within 5 km of the coast (compute domain). ASSUMPTION
  beach_max_z_m: 10             # specified by the authors: land "close to sea level" -> z <= 10 m and slope < 10 deg
  beach_max_slope_deg: 10
  hoist_max_z_m: 5              # specified by the authors: cliff "a few meters above sea level", pulley -> top <= 5 m
  attach_radius_blocks: 2       # a landing attaches to a water block within 2 blocks (180 m)
  payload_kg: 2000              # H&F 2006 p.12, 18: 2,000 kg benchmark stone load per craft (tsukupin, buoyancy)
  crew: 10                      # H&F 2006 p.18: 800 kg of crew in the 2,000 kg-load tsukupin; / 80 kg per person (ASSUMPTION)
  transfer_h: 0.25              # load/unload at each landing = transport.load_unload_h (sledge loading). ASSUMPTION
  people_walk_to_landing_m: 2000   # people walk at most 2 km (straight line) to / from a landing. ASSUMPTION
  people_embark_h: 0.25         # embark + disembark per sea journey of a helper group. ASSUMPTION
  people_max_h: 6.0             # people sea journeys longer than this are not tabulated (never faster than walking in practice)

# --- MOST_REALISTIC (specified by the authors; MOST_REALISTIC_NOTES.md). Top-level key, read by alliance.scenario() only,
# so no other run signature changes. Phasing by name suffix: MOST_REALISTIC_P10 (headline), _P20, _P100 (all at once).
#   social = A3_trust_learning (requests, trust, specialisation; b = 0.85 skill learning)
#   tech_rules = the per-site literature rules of lit_scenarios.list.REALISTIC (stages, S6 density, mu 0.38 / rails)
#   sea_kn = 2 (laden craft, Hazell & Fitzpatrick 2006 p.18)
#   builders_rule (specified by the authors): the per-nuraghe work party. residents ~ U[lo, hi] by tower count, builders =
#     round(0.5 x residents) (adults of both sexes; 0.5 = ASSUMPTION). TWR1 5-40 -> 3-20; 2 40-110 -> 20-55;
#     3 110-185 -> 55-93; 4 185-260 -> 93-130; 5 260-330 -> 130-165; 6-7 330-400 -> 165-200. Context (NUR C4): Webster
#     2015: 51 (5-6 per household), Webster 1991: 853 (~40 per nuraghe, Borore; Porcarzos ~400), Webster & Webster
#     1998 (Duos 70-110), Ugas via secondary (166-259 per canton). Interpolation between anchors: ours.
#   max_seasons 20000: small work parties alone under P10 can exceed the default 3,000-season safety stop.
mr_work_party: &mr_work_party
  residents_by_towers: [[5, 40], [40, 110], [110, 185], [185, 260], [260, 330], [330, 400], [330, 400]]
  adult_share: 0.5
alliance_extra:
  MOST_REALISTIC:       {requests: true, trust: true, specialisation: true, tech_rules: REALISTIC, sea_kn: 2,
                         builders_rule: *mr_work_party, max_seasons: 20000}
  MOST_REALISTIC_alone: {tech_rules: REALISTIC, sea_kn: 2, builders_rule: *mr_work_party, max_seasons: 20000}   # A0 rules: network-need baseline
