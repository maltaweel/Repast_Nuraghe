# --- 1 Nov 2026 (b) wider-literature scenarios (specified by the authors; WIDER_LIT_1101.md): each = MOST_REALISTIC + ONE switch,
# run as NAME_P10 so they compare with the headline MOST_REALISTIC_P10. Every value: source (page) or ASSUMPTION in
# WIDER_LIT_1101.md and the report chapter "Scenarios from the wider literature".
#   haul_profile (C1, C3 loading, M3, M4): land-haul crews / speed / friction / loading per site rule (short = sledge on
#       dry ground mu 0.38, long = rails mu 0.1); wet = sledge on wetted sand; walk = walked blocks. Sea faces unchanged.
#   stage_rates (C2, C3): stage person-hours per m3 swapped (quarry by S1 rule, walling, facade dressing).
#   carry (C2): hauls up to max_m costed per tonne (Erasmus sled hauling via Webster 1991: 852).
#   masons (M2): island pool of master masons for the vault share of the build stage, travelling between sites.
#   phase_order rule emulation (M1): later P10 cohorts drawn with weight 1 + strength x built towers within R_m.
wl_masons_c: &mas_c {pool0: 50, per_new: 20, vault_share: 0.5, need: tholos, exempt_types: [*proto]}
wl_walk: &walk {kg_per_person: 241.67, min_crew: 3, speed_ms: 0.041667, load_h: 0.25}
alliance_wl:     # merged by alliance.scenario(); names end in _P10 when run
  # C1 Harris 2016: 10 haulers per ~1 t on a timber slipway (100 kg per person; friction equivalent 30 kgf / 100 kg = 0.3)
  MOST_REALISTIC_C1_rails:     {<<: *mr, haul_profile: {long: {pull_kg: 100.0, moves: c03}}}
  MOST_REALISTIC_C1_rails_relay: {<<: *mr, haul_profile: {long: {pull_kg: 41.667, moves: c03}}}   # + 14 slipway relayers
  MOST_REALISTIC_C1_all:       {<<: *mr, haul_profile: {short: {pull_kg: 100.0, moves: c03}, long: {pull_kg: 100.0, moves: c03}}}
  MOST_REALISTIC_C1_all_slow:  {<<: *mr, haul_profile: {short: {pull_kg: 100.0, moves: c03, speed_ms: 0.447},
                                                        long: {pull_kg: 100.0, moves: c03, speed_ms: 0.447}}}
  # C2 Erasmus 1965 (5-h man-days): walling 10.5 ph/m3 (p. 291 via Kaner 2022: 182); sled hauling 1,200 kg per
  # 5-h man-day over <= 200 m (pp. 286-7 via Webster 1991: 852) = 4.167 ph/t; Webster's man-days read as 5-h days
  MOST_REALISTIC_C2_wall:      {<<: *mr, stage_rates: {build_ph_m3: 10.5}}
  MOST_REALISTIC_C2_sled200:   {<<: *mr, carry: {ph_per_t: 4.1667, max_m: 200.0}}
  MOST_REALISTIC_C2_day5:      {<<: *mr, stage_rates: {build_ph_m3: 3.0934, webster_dress_hours: 5.0}}
  # C3 Boswinkel 2021 (Mycenae, Teichos Dymaion): stage by stage
  MOST_REALISTIC_C3_quarry:    {<<: *mr, stage_rates: {quarry_ph_m3: {joints_low: 17.5}}}
  MOST_REALISTIC_C3_load:      {<<: *mr, haul_profile: {short: {load_ph_per_t: 1.2}, long: {load_ph_per_t: 1.2}}}
  MOST_REALISTIC_C3_set_low:   {<<: *mr, stage_rates: {build_ph_m3: 6.289}}
  MOST_REALISTIC_C3_set_high:  {<<: *mr, stage_rates: {build_ph_m3: 10.0}}
  MOST_REALISTIC_C3_dress:     {<<: *mr, stage_rates: {facade_dress_ph_m3: 59.5}}
  MOST_REALISTIC_C3_all:       {<<: *mr, stage_rates: {quarry_ph_m3: {joints_low: 17.5}, build_ph_m3: 7.849, facade_dress_ph_m3: 59.5},
                                haul_profile: {short: {load_ph_per_t: 1.2}, long: {load_ph_per_t: 1.2}}}
  # M1 peer-polity emulation (ASSUMPTION values)
  MOST_REALISTIC_M1_s1_R5:     {<<: *mr, phase_order: {rule: emulation, strength: 1.0, R_m: 5000}}
  MOST_REALISTIC_M1_s01_R5:    {<<: *mr, phase_order: {rule: emulation, strength: 0.1, R_m: 5000}}
  MOST_REALISTIC_M1_s10_R5:    {<<: *mr, phase_order: {rule: emulation, strength: 10.0, R_m: 5000}}
  MOST_REALISTIC_M1_s1_R2500:  {<<: *mr, phase_order: {rule: emulation, strength: 1.0, R_m: 2500}}
  MOST_REALISTIC_M1_s1_R10:    {<<: *mr, phase_order: {rule: emulation, strength: 1.0, R_m: 10000}}
  # M2 mobile master masons (ASSUMPTION values)
  MOST_REALISTIC_M2_central:   {<<: *mr, masons: *mas_c}
