  MOST_REALISTIC_M3_sand40:    {<<: *mr, haul_profile: {wet: {mu: 0.228, moves: c0228, mode: route_share, key: sandwet500}}}
  MOST_REALISTIC_M3_stream40:  {<<: *mr, haul_profile: {wet: {mu: 0.228, moves: c0228, mode: route_share, key: wet500}}}
  MOST_REALISTIC_M3_all_half:  {<<: *mr, haul_profile: {wet: {mu: 0.19, moves: c019, mode: all}}}
  # M4 walked blocks (Lipo et al. 2013: 18 people, 4.35 t, 100 m in 40 min)
  MOST_REALISTIC_M4_1t:        {<<: *mr, haul_profile: {walk: {<<: *walk, min_kg: 1000}}}
  MOST_REALISTIC_M4_any:       {<<: *mr, haul_profile: {walk: {<<: *walk, min_kg: 0}}}

